<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>汉字 Z-Type — Learn Chinese with Aliens</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      background: #06061a;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      color: #e0e0ff;
    }

    h1 {
      font-size: 22px;
      font-weight: 500;
      color: #7ab0ff;
      margin-bottom: 12px;
      letter-spacing: 0.04em;
    }

    #game-root {
      background: #0a0a1a;
      color: #e0e0ff;
      width: 700px;
      max-width: 100vw;
      position: relative;
      overflow: hidden;
      border-radius: 12px;
      border: 0.5px solid rgba(100, 120, 255, 0.25);
      user-select: none;
    }

    #canvas {
      display: block;
      width: 100%;
      height: 520px;
    }

    #hud {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 8px 16px;
      background: rgba(0, 0, 20, 0.9);
      border-top: 0.5px solid rgba(100, 120, 255, 0.3);
    }

    #input-area {
      display: flex;
      gap: 8px;
      padding: 8px 16px;
      background: rgba(0, 0, 20, 0.95);
      border-top: 0.5px solid rgba(100, 120, 255, 0.2);
    }

    #pinyin-input {
      flex: 1;
      background: rgba(30, 30, 80, 0.8);
      border: 0.5px solid rgba(100, 120, 255, 0.4);
      border-radius: 8px;
      color: #e0e0ff;
      padding: 8px 12px;
      font-size: 16px;
      outline: none;
    }

    #pinyin-input:focus {
      border-color: rgba(100, 180, 255, 0.8);
    }

    #wave-banner {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      background: rgba(10, 10, 40, 0.95);
      border: 0.5px solid rgba(100, 180, 255, 0.5);
      border-radius: 12px;
      padding: 24px 36px;
      text-align: center;
      z-index: 10;
      display: none;
      min-width: 320px;
    }

    #wave-banner h2 {
      color: #7ab0ff;
      margin: 0 0 8px;
      font-size: 22px;
      font-weight: 500;
    }

    #wave-banner p {
      color: #a0b8e0;
      margin: 0 0 16px;
      font-size: 14px;
      line-height: 1.6;
    }

    #wave-banner button {
      background: rgba(60, 100, 220, 0.3);
      border: 0.5px solid rgba(100, 150, 255, 0.5);
      color: #c0d8ff;
      border-radius: 8px;
      padding: 8px 24px;
      font-size: 15px;
      cursor: pointer;
      transition: background 0.15s;
    }

    #wave-banner button:hover {
      background: rgba(60, 100, 220, 0.5);
    }

    .stat-label { color: #7090b0; font-size: 13px; }
    .stat-value { color: #a0c8ff; font-size: 15px; font-weight: 500; }

    #lives-display { display: flex; gap: 4px; align-items: center; }
    .life-dot { width: 10px; height: 10px; border-radius: 50%; background: #ff6060; }
    .life-dot.lost { background: #333; }

    footer {
      margin-top: 12px;
      font-size: 12px;
      color: rgba(120, 140, 180, 0.5);
    }
  </style>
</head>
<body>
  <h1>汉字 Z-Type</h1>

  <div id="game-root">
    <canvas id="canvas"></canvas>

    <div id="wave-banner">
      <h2 id="banner-title">Wave 1: Food & Drink</h2>
      <p id="banner-desc">Type the pinyin for each Chinese character to destroy the alien!</p>
      <button id="banner-btn">Start Wave</button>
    </div>

    <div id="hud">
      <div><span class="stat-label">Score </span><span class="stat-value" id="score-display">0</span></div>
      <div><span class="stat-label">Wave </span><span class="stat-value" id="wave-display">1</span></div>
      <div id="lives-display"></div>
      <div><span class="stat-label">Accuracy </span><span class="stat-value" id="acc-display">—</span></div>
    </div>

    <div id="input-area">
      <input id="pinyin-input" type="text" placeholder="Type pinyin here and press Enter..."
        autocomplete="off" autocorrect="off" spellcheck="false" />
    </div>
  </div>

  <footer>Shoot aliens by typing their pinyin. Don't let them cross the danger line!</footer>

  <script>
    const WAVES = [
      {
        name: "Wave 1: Food & Drink",
        color: "#ff9955",
        words: [
          { char: "水", pinyin: "shui", meaning: "water" },
          { char: "饭", pinyin: "fan", meaning: "rice/meal" },
          { char: "茶", pinyin: "cha", meaning: "tea" },
          { char: "肉", pinyin: "rou", meaning: "meat" },
          { char: "鱼", pinyin: "yu", meaning: "fish" },
          { char: "面", pinyin: "mian", meaning: "noodles" },
          { char: "鸡", pinyin: "ji", meaning: "chicken" },
          { char: "蛋", pinyin: "dan", meaning: "egg" },
          { char: "奶", pinyin: "nai", meaning: "milk" },
          { char: "菜", pinyin: "cai", meaning: "vegetable" },
        ]
      },
      {
        name: "Wave 2: Numbers",
        color: "#55aaff",
        words: [
          { char: "一", pinyin: "yi", meaning: "one" },
          { char: "二", pinyin: "er", meaning: "two" },
          { char: "三", pinyin: "san", meaning: "three" },
          { char: "四", pinyin: "si", meaning: "four" },
          { char: "五", pinyin: "wu", meaning: "five" },
          { char: "六", pinyin: "liu", meaning: "six" },
          { char: "七", pinyin: "qi", meaning: "seven" },
          { char: "八", pinyin: "ba", meaning: "eight" },
          { char: "九", pinyin: "jiu", meaning: "nine" },
          { char: "十", pinyin: "shi", meaning: "ten" },
        ]
      },
      {
        name: "Wave 3: People & Family",
        color: "#aa66ff",
        words: [
          { char: "我", pinyin: "wo", meaning: "I/me" },
          { char: "你", pinyin: "ni", meaning: "you" },
          { char: "他", pinyin: "ta", meaning: "he/him" },
          { char: "她", pinyin: "ta", meaning: "she/her" },
          { char: "们", pinyin: "men", meaning: "plural marker" },
          { char: "爸", pinyin: "ba", meaning: "dad" },
          { char: "妈", pinyin: "ma", meaning: "mom" },
          { char: "哥", pinyin: "ge", meaning: "older brother" },
          { char: "姐", pinyin: "jie", meaning: "older sister" },
          { char: "朋友", pinyin: "pengyou", meaning: "friend" },
        ]
      },
      {
        name: "Wave 4: Colors",
        color: "#55dd88",
        words: [
          { char: "红", pinyin: "hong", meaning: "red" },
          { char: "蓝", pinyin: "lan", meaning: "blue" },
          { char: "绿", pinyin: "lv", meaning: "green" },
          { char: "白", pinyin: "bai", meaning: "white" },
          { char: "黑", pinyin: "hei", meaning: "black" },
          { char: "黄", pinyin: "huang", meaning: "yellow" },
          { char: "紫", pinyin: "zi", meaning: "purple" },
          { char: "橙", pinyin: "cheng", meaning: "orange" },
          { char: "粉", pinyin: "fen", meaning: "pink" },
          { char: "灰", pinyin: "hui", meaning: "gray" },
        ]
      },
      {
        name: "Wave 5: Common Verbs",
        color: "#ff5577",
        words: [
          { char: "吃", pinyin: "chi", meaning: "eat" },
          { char: "喝", pinyin: "he", meaning: "drink" },
          { char: "去", pinyin: "qu", meaning: "go" },
          { char: "来", pinyin: "lai", meaning: "come" },
          { char: "看", pinyin: "kan", meaning: "look/watch" },
          { char: "说", pinyin: "shuo", meaning: "speak" },
          { char: "听", pinyin: "ting", meaning: "listen" },
          { char: "学", pinyin: "xue", meaning: "learn/study" },
          { char: "写", pinyin: "xie", meaning: "write" },
          { char: "买", pinyin: "mai", meaning: "buy" },
        ]
      }
    ];

    const canvas = document.getElementById('canvas');
    const ctx = canvas.getContext('2d');
    const input = document.getElementById('pinyin-input');
    const banner = document.getElementById('wave-banner');
    const bannerTitle = document.getElementById('banner-title');
    const bannerDesc = document.getElementById('banner-desc');
    const bannerBtn = document.getElementById('banner-btn');
    const scoreEl = document.getElementById('score-display');
    const waveEl = document.getElementById('wave-display');
    const accEl = document.getElementById('acc-display');
    const livesEl = document.getElementById('lives-display');

    let W, H;
    function resize() {
      W = canvas.offsetWidth; H = canvas.offsetHeight;
      canvas.width = W; canvas.height = H;
    }
    resize();
    window.addEventListener('resize', resize);

    let aliens = [], particles = [], bullets = [];
    let score = 0, lives = 3, waveIdx = 0;
    let totalAttempts = 0, correctAttempts = 0;
    let gameState = 'banner';
    let wordQueue = [];
    let spawnTimer = 0;
    const SPAWN_INTERVAL = 2200;

    function shuffle(arr) {
      const a = [...arr];
      for (let i = a.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [a[i], a[j]] = [a[j], a[i]];
      }
      return a;
    }

    function initWave() {
      aliens = []; particles = []; bullets = [];
      spawnTimer = 0;
      wordQueue = shuffle(WAVES[waveIdx].words);
    }

    function spawnAlien() {
      if (wordQueue.length === 0) return;
      const word = wordQueue.shift();
      const wave = WAVES[waveIdx];
      const x = 60 + Math.random() * (W - 120);
      aliens.push({
        x, y: -50,
        word,
        color: wave.color,
        speed: 0.25 + waveIdx * 0.06 + Math.random() * 0.12,
        width: 70 + word.char.length * 18,
        height: 54,
        hit: false,
        hitTimer: 0,
        glowPhase: Math.random() * Math.PI * 2,
        waveAmp: 15 + Math.random() * 15,
        waveFreq: 0.002 + Math.random() * 0.001,
        waveOffset: Math.random() * 1000,
        baseX: x,
        alive: true,
      });
    }

    function addParticles(x, y, color) {
      for (let i = 0; i < 22; i++) {
        const angle = Math.random() * Math.PI * 2;
        const speed = 1.5 + Math.random() * 4;
        particles.push({
          x, y,
          vx: Math.cos(angle) * speed,
          vy: Math.sin(angle) * speed,
          life: 1,
          decay: 0.025 + Math.random() * 0.02,
          size: 2 + Math.random() * 4,
          color
        });
      }
    }

    function fireBullet(alien) {
      bullets.push({
        x: W / 2, y: H - 30,
        tx: alien.x, ty: alien.y,
        progress: 0,
        speed: 0.05,
        color: WAVES[waveIdx].color
      });
    }

    function drawStars(t) {
      if (!drawStars.stars) {
        drawStars.stars = Array.from({ length: 80 }, () => ({
          x: Math.random(), y: Math.random(),
          r: 0.5 + Math.random() * 1.5,
          phase: Math.random() * Math.PI * 2
        }));
      }
      drawStars.stars.forEach(s => {
        const alpha = 0.3 + 0.4 * Math.sin(t * 0.001 + s.phase);
        ctx.fillStyle = `rgba(180,200,255,${alpha})`;
        ctx.beginPath();
        ctx.arc(s.x * W, s.y * H, s.r, 0, Math.PI * 2);
        ctx.fill();
      });
    }

    function drawShip() {
      const cx = W / 2, cy = H - 28;
      ctx.save();
      ctx.shadowColor = WAVES[waveIdx].color;
      ctx.shadowBlur = 14;
      ctx.fillStyle = '#c0d8ff';
      ctx.beginPath();
      ctx.moveTo(cx, cy - 18);
      ctx.lineTo(cx - 14, cy + 12);
      ctx.lineTo(cx, cy + 6);
      ctx.lineTo(cx + 14, cy + 12);
      ctx.closePath();
      ctx.fill();
      ctx.fillStyle = WAVES[waveIdx].color;
      ctx.beginPath();
      ctx.arc(cx, cy - 4, 5, 0, Math.PI * 2);
      ctx.fill();
      ctx.restore();
    }

    function drawAlien(a, t) {
      const glow = 0.5 + 0.5 * Math.sin(t * 0.003 + a.glowPhase);
      ctx.save();
      ctx.shadowColor = a.color;
      ctx.shadowBlur = a.hit ? 30 : 12 + glow * 8;

      const hw = a.width / 2, hh = a.height / 2;
      ctx.fillStyle = a.hit ? '#fff' : 'rgba(20,20,50,0.85)';
      ctx.strokeStyle = a.color;
      ctx.lineWidth = 1.5;
      ctx.beginPath();
      ctx.roundRect(a.x - hw, a.y - hh, a.width, a.height, 10);
      ctx.fill();
      ctx.stroke();

      ctx.fillStyle = a.hit ? '#222' : a.color;
      ctx.font = `bold ${24 + a.word.char.length * 2}px sans-serif`;
      ctx.textAlign = 'center';
      ctx.textBaseline = 'middle';
      ctx.fillText(a.word.char, a.x, a.y - 6);

      ctx.fillStyle = 'rgba(180,200,255,0.55)';
      ctx.font = '11px sans-serif';
      ctx.fillText(a.word.meaning, a.x, a.y + 14);

      ctx.restore();
    }

    function drawBullet(b) {
      const lx = b.x + (b.tx - b.x) * (b.progress - 0.04);
      const ly = b.y + (b.ty - b.y) * (b.progress - 0.04);
      const cx2 = b.x + (b.tx - b.x) * b.progress;
      const cy2 = b.y + (b.ty - b.y) * b.progress;
      ctx.save();
      ctx.strokeStyle = b.color;
      ctx.lineWidth = 2.5;
      ctx.shadowColor = b.color;
      ctx.shadowBlur = 10;
      ctx.beginPath();
      ctx.moveTo(lx, ly);
      ctx.lineTo(cx2, cy2);
      ctx.stroke();
      ctx.fillStyle = '#fff';
      ctx.beginPath();
      ctx.arc(cx2, cy2, 3, 0, Math.PI * 2);
      ctx.fill();
      ctx.restore();
    }

    function drawParticle(p) {
      ctx.save();
      ctx.globalAlpha = p.life;
      ctx.fillStyle = p.color;
      ctx.shadowColor = p.color;
      ctx.shadowBlur = 6;
      ctx.beginPath();
      ctx.arc(p.x, p.y, p.size * p.life, 0, Math.PI * 2);
      ctx.fill();
      ctx.restore();
    }

    function drawDangerZone() {
      ctx.save();
      ctx.strokeStyle = 'rgba(255,80,80,0.2)';
      ctx.setLineDash([6, 8]);
      ctx.lineWidth = 1;
      ctx.beginPath();
      ctx.moveTo(0, H - 55);
      ctx.lineTo(W, H - 55);
      ctx.stroke();
      ctx.restore();
    }

    function updateLivesDisplay() {
      livesEl.innerHTML = '';
      for (let i = 0; i < 3; i++) {
        const d = document.createElement('div');
        d.className = 'life-dot' + (i >= lives ? ' lost' : '');
        livesEl.appendChild(d);
      }
    }

    function tryShoot(typedPinyin) {
      const typed = typedPinyin.trim().toLowerCase();
      if (!typed) return false;
      totalAttempts++;
      for (let i = 0; i < aliens.length; i++) {
        const a = aliens[i];
        if (!a.alive) continue;
        if (a.word.pinyin.toLowerCase() === typed) {
          fireBullet(a);
          a.hit = true; a.hitTimer = 18;
          correctAttempts++;
          score += 10 + waveIdx * 5;
          scoreEl.textContent = score;
          accEl.textContent = Math.round(correctAttempts / totalAttempts * 100) + '%';
          return true;
        }
      }
      accEl.textContent = Math.round(correctAttempts / totalAttempts * 100) + '%';
      return false;
    }

    let lastTime = 0;
    function loop(t) {
      const dt = Math.min(t - lastTime, 50);
      lastTime = t;

      ctx.clearRect(0, 0, W, H);
      ctx.fillStyle = '#06061a';
      ctx.fillRect(0, 0, W, H);

      drawStars(t);
      drawDangerZone();
      drawShip();

      if (gameState === 'playing') {
        spawnTimer += dt;
        if (spawnTimer > SPAWN_INTERVAL && wordQueue.length > 0) {
          spawnAlien(); spawnTimer = 0;
        }

        let waveCleared = wordQueue.length === 0 && aliens.filter(a => a.alive).length === 0;

        aliens.forEach(a => {
          if (!a.alive) return;
          a.y += a.speed * dt / 16;
          a.x = a.baseX + Math.sin(t * a.waveFreq + a.waveOffset) * a.waveAmp;
          if (a.hitTimer > 0) a.hitTimer--;
          if (a.hitTimer === 0 && a.hit) {
            addParticles(a.x, a.y, a.color);
            a.alive = false;
          }
          if (!a.hit && a.y > H - 55) {
            a.alive = false;
            lives--;
            updateLivesDisplay();
            addParticles(a.x, a.y, '#ff4444');
            if (lives <= 0) { gameState = 'gameover'; showGameOver(); return; }
          }
          if (a.alive) drawAlien(a, t);
        });

        bullets.forEach(b => { b.progress = Math.min(b.progress + b.speed, 1); });
        bullets = bullets.filter(b => b.progress < 1);
        bullets.forEach(b => drawBullet(b));

        particles.forEach(p => {
          p.x += p.vx; p.y += p.vy; p.vy += 0.08;
          p.life -= p.decay; p.size *= 0.97;
        });
        particles = particles.filter(p => p.life > 0);
        particles.forEach(drawParticle);

        if (waveCleared && gameState === 'playing') {
          gameState = 'banner';
          waveIdx++;
          if (waveIdx >= WAVES.length) showVictory();
          else setTimeout(() => showWaveBanner(), 400);
        }
      }

      requestAnimationFrame(loop);
    }

    function showWaveBanner() {
      const w = WAVES[waveIdx];
      bannerTitle.textContent = w.name;
      bannerDesc.innerHTML = `Destroy the aliens by typing the <strong>pinyin</strong> for each character!<br>Watch out — they cross the danger line and you lose a life!`;
      bannerBtn.textContent = waveIdx === 0 ? 'Start Wave' : 'Next Wave!';
      banner.style.display = 'block';
      input.disabled = true;
    }

    function showGameOver() {
      bannerTitle.textContent = 'Game Over!';
      bannerDesc.innerHTML = `Score: <strong>${score}</strong> &nbsp;|&nbsp; Accuracy: <strong>${accEl.textContent}</strong><br>Keep practising your Chinese!`;
      bannerBtn.textContent = 'Play Again';
      banner.style.display = 'block';
      input.disabled = true;
    }

    function showVictory() {
      bannerTitle.textContent = '🎉 You won!';
      bannerDesc.innerHTML = `All waves cleared!<br>Score: <strong>${score}</strong> &nbsp;|&nbsp; Accuracy: <strong>${accEl.textContent}</strong>`;
      bannerBtn.textContent = 'Play Again';
      banner.style.display = 'block';
      input.disabled = true;
    }

    bannerBtn.addEventListener('click', () => {
      if (bannerBtn.textContent === 'Play Again') {
        score = 0; lives = 3; waveIdx = 0;
        totalAttempts = 0; correctAttempts = 0;
        scoreEl.textContent = '0'; accEl.textContent = '—';
        updateLivesDisplay();
      }
      banner.style.display = 'none';
      input.disabled = false;
      input.focus();
      waveEl.textContent = waveIdx + 1;
      initWave();
      gameState = 'playing';
      spawnAlien();
    });

    input.addEventListener('keydown', e => {
      if (e.key === 'Enter') {
        const val = input.value;
        const hit = tryShoot(val);
        if (hit || val.trim()) input.value = '';
      }
    });

    updateLivesDisplay();
    showWaveBanner();
    requestAnimationFrame(loop);
  </script>
</body>
</html>

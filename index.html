<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>汉字 Vocab Game</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      background: #06061a;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      color: #e0e0ff;
    }

    h1 {
      font-size: 22px;
      font-weight: 500;
      color: #7ab0ff;
      margin-bottom: 12px;
      letter-spacing: 0.04em;
    }

    #game-root {
      background: #0a0a1a;
      color: #e0e0ff;
      width: 700px;
      max-width: 100vw;
      position: relative;
      overflow: hidden;
      border-radius: 12px;
      border: 0.5px solid rgba(100, 120, 255, 0.25);
      user-select: none;
    }

    #canvas {
      display: block;
      width: 100%;
      height: 520px;
    }

    #hud {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 8px 16px;
      background: rgba(0, 0, 20, 0.9);
      border-top: 0.5px solid rgba(100, 120, 255, 0.3);
    }

    #input-area {
      display: flex;
      gap: 8px;
      padding: 8px 16px;
      background: rgba(0, 0, 20, 0.95);
      border-top: 0.5px solid rgba(100, 120, 255, 0.2);
    }

    #pinyin-input {
      flex: 1;
      background: rgba(30, 30, 80, 0.8);
      border: 0.5px solid rgba(100, 120, 255, 0.4);
      border-radius: 8px;
      color: #e0e0ff;
      padding: 8px 12px;
      font-size: 16px;
      outline: none;
    }

    #pinyin-input:focus {
      border-color: rgba(100, 180, 255, 0.8);
    }

    #wave-banner {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      background: rgba(10, 10, 40, 0.95);
      border: 0.5px solid rgba(100, 180, 255, 0.5);
      border-radius: 12px;
      padding: 24px 36px;
      text-align: center;
      z-index: 10;
      display: none;
      min-width: 320px;
    }

    #wave-banner h2 {
      color: #7ab0ff;
      margin: 0 0 8px;
      font-size: 22px;
      font-weight: 500;
    }

    #wave-banner p {
      color: #a0b8e0;
      margin: 0 0 16px;
      font-size: 14px;
      line-height: 1.6;
    }

    #wave-picker {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 6px;
      margin: 0 0 16px;
    }

    #wave-picker label {
      color: #7090b0;
      font-size: 12px;
    }

    #wave-select {
      background: rgba(30, 30, 80, 0.8);
      border: 0.5px solid rgba(100, 150, 255, 0.5);
      border-radius: 8px;
      color: #c0d8ff;
      padding: 8px 12px;
      font-size: 14px;
      outline: none;
      min-width: 220px;
      cursor: pointer;
    }

    #wave-select:focus {
      border-color: rgba(100, 180, 255, 0.8);
    }

    #wave-select option {
      background: #0a0a28;
      color: #c0d8ff;
    }

    #wave-banner button {
      background: rgba(60, 100, 220, 0.3);
      border: 0.5px solid rgba(100, 150, 255, 0.5);
      color: #c0d8ff;
      border-radius: 8px;
      padding: 8px 24px;
      font-size: 15px;
      cursor: pointer;
      transition: background 0.15s;
    }

    #wave-banner button:hover {
      background: rgba(60, 100, 220, 0.5);
    }

    .stat-label { color: #7090b0; font-size: 13px; }
    .stat-value { color: #a0c8ff; font-size: 15px; font-weight: 500; }

    #lives-display { display: flex; gap: 4px; align-items: center; }
    .life-dot { width: 10px; height: 10px; border-radius: 50%; background: #ff6060; }
    .life-dot.lost { background: #333; }

    footer {
      margin-top: 12px;
      font-size: 12px;
      color: rgba(120, 140, 180, 0.5);
      text-align: center;
      line-height: 1.6;
    }

    footer a {
      color: rgba(120, 160, 220, 0.7);
    }

      <div id="lives-display"></div>

      return wave.name.replace(/^Wave \d+: /, '');
    }

    (function populateWaveSelect() {
      const randomOpt = document.createElement('option');
      randomOpt.value = 'random';
      randomOpt.textContent = 'Random (all themes)';
      waveSelect.appendChild(randomOpt);
      WAVES.forEach((w, i) => {
        const opt = document.createElement('option');
        opt.value = String(i);
        opt.textContent = themeName(w);
        waveSelect.appendChild(opt);
      });

    let W, H;
    function resize() {
      W = canvas.offsetWidth; H = canvas.offsetHeight;
      canvas.width = W; canvas.height = H;
    }

    // ── Game state ──────────────────────────────────────────────
    let aliens = [], particles = [], bullets = [];
    let score = 0, lives = 3, waveIdx = 0;
    let waveOrder = [];
    let missedWords = [];
    let totalAttempts = 0, correctAttempts = 0;
    let gameState = 'banner';
    let wordQueue = [];
    let spawnTimer = 0;
    const SPAWN_INTERVAL = 2500;

    function normalizePinyin(p) {
      return p.toLowerCase().replace(/[\s-]/g, '');
    }

    function shuffle(arr) {
      const a = [...arr];
      for (let i = a.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [a[i], a[j]] = [a[j], a[i]];
      }
      return a;
    }

    function shuffleWaveOrder(preferredIdx) {
      if (preferredIdx == null || Number.isNaN(preferredIdx)) {
        waveOrder = shuffle(WAVES.map((_, i) => i));
        return;
      }
      const rest = shuffle(WAVES.map((_, i) => i).filter(i => i !== preferredIdx));
      waveOrder = [preferredIdx, ...rest];
    }

    function applyWaveSelection() {
      const val = waveSelect.value;
      if (val === 'random') shuffleWaveOrder();
      else shuffleWaveOrder(Number(val));
      waveIdx = 0;
    }

    function currentWave() {
      return WAVES[waveOrder[waveIdx]];
    }

    function initWave() {
      aliens = []; particles = []; bullets = [];
      spawnTimer = 0;
      wordQueue = shuffle(currentWave().words);
    }

    function spawnAlien() {
      if (wordQueue.length === 0) return;
      const word = wordQueue.shift();
      const wave = currentWave();
      const x = 60 + Math.random() * (W - 120);
      aliens.push({
        x, y: -50,
        word,
        color: wave.color,
        speed: (0.1 + Math.random() * 0.1) * 0.9,
        width: 70 + word.char.length * 18,
        height: 54,
        hit: false,
        hitTimer: 0,
        glowPhase: Math.random() * Math.PI * 2,
        waveAmp: 15 + Math.random() * 15,
        waveFreq: 0.002 + Math.random() * 0.001,
        waveOffset: Math.random() * 1000,
        baseX: x,
        alive: true,
      });
    }

    function addParticles(x, y, color) {
      for (let i = 0; i < 22; i++) {
        const angle = Math.random() * Math.PI * 2;
        const speed = 1.5 + Math.random() * 4;
        particles.push({
          x, y,
          vx: Math.cos(angle) * speed,
          vy: Math.sin(angle) * speed,
          life: 1,
          decay: 0.025 + Math.random() * 0.02,
          size: 2 + Math.random() * 4,
          color
        });
      }
    }

    function fireBullet(alien) {
      bullets.push({
        x: W / 2, y: H - 30,
        tx: alien.x, ty: alien.y,
        progress: 0,
        speed: 0.05,
        color: currentWave().color
      });
    }

    function drawStars(t) {
      if (!drawStars.stars) {
        drawStars.stars = Array.from({ length: 80 }, () => ({
          x: Math.random(), y: Math.random(),
          r: 0.5 + Math.random() * 1.5,
          phase: Math.random() * Math.PI * 2
        }));
      }
      drawStars.stars.forEach(s => {
        const alpha = 0.3 + 0.4 * Math.sin(t * 0.001 + s.phase);
        ctx.fillStyle = `rgba(180,200,255,${alpha})`;
        ctx.beginPath();
        ctx.arc(s.x * W, s.y * H, s.r, 0, Math.PI * 2);
        ctx.fill();
      });
    }

    function drawShip() {
      const cx = W / 2, cy = H - 28;
      ctx.save();
      ctx.shadowColor = currentWave().color;
      ctx.shadowBlur = 14;
      ctx.fillStyle = '#c0d8ff';
      ctx.beginPath();
      ctx.moveTo(cx, cy - 18);
      ctx.lineTo(cx - 14, cy + 12);
      ctx.lineTo(cx, cy + 6);
      ctx.lineTo(cx + 14, cy + 12);
      ctx.closePath();
      ctx.fill();
      ctx.fillStyle = currentWave().color;
      ctx.beginPath();
      ctx.arc(cx, cy - 4, 5, 0, Math.PI * 2);
      ctx.fill();
      ctx.restore();
    }

    function drawAlien(a, t) {
      const glow = 0.5 + 0.5 * Math.sin(t * 0.003 + a.glowPhase);
      ctx.save();
      ctx.shadowColor = a.color;
      ctx.shadowBlur = a.hit ? 30 : 12 + glow * 8;

      const hw = a.width / 2, hh = a.height / 2;
      ctx.fillStyle = a.hit ? '#fff' : 'rgba(20,20,50,0.85)';
      ctx.strokeStyle = a.color;
      ctx.lineWidth = 1.5;
      ctx.beginPath();
      ctx.roundRect(a.x - hw, a.y - hh, a.width, a.height, 10);
      ctx.fill();
      ctx.stroke();

      ctx.fillStyle = a.hit ? '#222' : a.color;
      ctx.font = `bold ${24 + a.word.char.length * 2}px sans-serif`;
      ctx.textAlign = 'center';
      ctx.textBaseline = 'middle';
      ctx.fillText(a.word.char, a.x, a.y - 6);

      ctx.fillStyle = 'rgba(180,200,255,0.55)';
      ctx.font = '11px sans-serif';
      ctx.fillText(a.word.meaning, a.x, a.y + 14);

      ctx.restore();
    }

    function drawBullet(b) {
      const lx = b.x + (b.tx - b.x) * (b.progress - 0.04);
      const ly = b.y + (b.ty - b.y) * (b.progress - 0.04);
      const cx2 = b.x + (b.tx - b.x) * b.progress;
      const cy2 = b.y + (b.ty - b.y) * b.progress;
      ctx.save();
      ctx.strokeStyle = b.color;
      ctx.lineWidth = 2.5;
      ctx.shadowColor = b.color;
      ctx.shadowBlur = 10;
      ctx.beginPath();
      ctx.moveTo(lx, ly);
      ctx.lineTo(cx2, cy2);
      ctx.stroke();
      ctx.fillStyle = '#fff';
      ctx.beginPath();
      ctx.arc(cx2, cy2, 3, 0, Math.PI * 2);
      ctx.fill();
      ctx.restore();
    }

    function drawParticle(p) {
      ctx.save();
      ctx.globalAlpha = p.life;
      ctx.fillStyle = p.color;
      ctx.shadowColor = p.color;
      ctx.shadowBlur = 6;
      ctx.beginPath();
      ctx.arc(p.x, p.y, p.size * p.life, 0, Math.PI * 2);
      ctx.fill();
      ctx.restore();
    }

    function drawDangerZone() {
      ctx.save();
      ctx.strokeStyle = 'rgba(255,80,80,0.2)';
      ctx.setLineDash([6, 8]);
      ctx.lineWidth = 1;
      ctx.beginPath();
      ctx.moveTo(0, H - 55);
      ctx.lineTo(W, H - 55);
      ctx.stroke();
      ctx.restore();
    }

    function updateLivesDisplay() {
      livesEl.innerHTML = '';
      for (let i = 0; i < 3; i++) {
        const d = document.createElement('div');
        d.className = 'life-dot' + (i >= lives ? ' lost' : '');
        livesEl.appendChild(d);
      }
    }

    function tryShoot(typedPinyin) {
      const typed = typedPinyin.trim().toLowerCase();
      if (!typed) return false;
      totalAttempts++;
      for (let i = 0; i < aliens.length; i++) {
        const a = aliens[i];
        if (!a.alive) continue;
        if (normalizePinyin(a.word.pinyin) === normalizePinyin(typed)) {
          fireBullet(a);
          a.hit = true; a.hitTimer = 18;
          correctAttempts++;
          score += 10 + waveIdx * 5;
          scoreEl.textContent = score;
          accEl.textContent = Math.round(correctAttempts / totalAttempts * 100) + '%';
          return true;
        }
      }
      accEl.textContent = Math.round(correctAttempts / totalAttempts * 100) + '%';
      return false;
    }

    let lastTime = 0;
    function loop(t) {
      const dt = Math.min(t - lastTime, 50);
      lastTime = t;

      ctx.clearRect(0, 0, W, H);
      ctx.fillStyle = '#06061a';
      ctx.fillRect(0, 0, W, H);

      drawStars(t);
      drawDangerZone();
      drawShip();

      if (gameState === 'playing') {
        spawnTimer += dt;
        if (spawnTimer > SPAWN_INTERVAL && wordQueue.length > 0) {
          spawnAlien(); spawnTimer = 0;
        }

        let waveCleared = wordQueue.length === 0 && aliens.filter(a => a.alive).length === 0;

        aliens.forEach(a => {
          if (!a.alive) return;
          a.y += a.speed * dt / 16;
          a.x = a.baseX + Math.sin(t * a.waveFreq + a.waveOffset) * a.waveAmp;
          if (a.hitTimer > 0) a.hitTimer--;
          if (a.hitTimer === 0 && a.hit) {
            addParticles(a.x, a.y, a.color);
            a.alive = false;
          }
          if (!a.hit && a.y > H - 55) {
            a.alive = false;
            missedWords.push(a.word);
            lives--;
            updateLivesDisplay();
            addParticles(a.x, a.y, '#ff4444');
            if (lives <= 0) { gameState = 'gameover'; showGameOver(); return; }
          }
          if (a.alive) drawAlien(a, t);
        });

        bullets.forEach(b => { b.progress = Math.min(b.progress + b.speed, 1); });
        bullets = bullets.filter(b => b.progress < 1);
        bullets.forEach(b => drawBullet(b));

        particles.forEach(p => {
          p.x += p.vx; p.y += p.vy; p.vy += 0.08;
          p.life -= p.decay; p.size *= 0.97;
        });
        particles = particles.filter(p => p.life > 0);
        particles.forEach(drawParticle);

        if (waveCleared && gameState === 'playing') {
          gameState = 'banner';
          waveIdx++;
          if (waveIdx >= WAVES.length) showVictory();
          else setTimeout(() => showWaveBanner(), 400);
        }
      }

      requestAnimationFrame(loop);
    }

    function showWaveBanner() {
      const w = currentWave();
      bannerTitle.textContent = `Wave ${waveIdx + 1}: ${themeName(w)}`;
      bannerDesc.innerHTML = `${w.words.length} words in this wave — type the <strong>pinyin</strong> for each character!<br>Watch out — they cross the danger line and you lose a life!`;
      bannerBtn.textContent = waveIdx === 0 ? 'Start Wave' : 'Next Wave!';
      wavePicker.style.display = waveIdx === 0 ? 'flex' : 'none';
      banner.style.display = 'block';
      input.disabled = true;
    }

    function showGameOver() {
      bannerTitle.textContent = 'Game Over!';
      const missed = missedWords.map(w => `${w.char} <strong>${w.pinyin}</strong>`).join(', ');
      bannerDesc.innerHTML = `Score: <strong>${score}</strong> &nbsp;|&nbsp; Accuracy: <strong>${accEl.textContent}</strong><br>Missed: ${missed}`;
      bannerBtn.textContent = 'Play Again';
      wavePicker.style.display = 'flex';
      banner.style.display = 'block';
      input.disabled = true;
    }

    function showVictory() {
      bannerTitle.textContent = '🎉 You won!';
      bannerDesc.innerHTML = `All waves cleared!<br>Score: <strong>${score}</strong> &nbsp;|&nbsp; Accuracy: <strong>${accEl.textContent}</strong>`;
      bannerBtn.textContent = 'Play Again';
      wavePicker.style.display = 'flex';
      banner.style.display = 'block';
      input.disabled = true;
    }

    waveSelect.addEventListener('change', () => {
      if (gameState !== 'playing') {
        applyWaveSelection();
        if (bannerBtn.textContent === 'Start Wave') showWaveBanner();
      }
    });

    bannerBtn.addEventListener('click', () => {
      if (bannerBtn.textContent === 'Play Again') {
        score = 0; lives = 3;
        missedWords = [];
        applyWaveSelection();
        totalAttempts = 0; correctAttempts = 0;
        scoreEl.textContent = '0'; accEl.textContent = '—';
        updateLivesDisplay();
      } else if (bannerBtn.textContent === 'Start Wave') {
        applyWaveSelection();
      }
      banner.style.display = 'none';
      input.disabled = false;
      input.focus();
      waveEl.textContent = waveIdx + 1;
      initWave();
      gameState = 'playing';
      spawnAlien();
    });

    input.addEventListener('keydown', e => {
      if (e.key === 'Enter') {
        const val = input.value;
        const hit = tryShoot(val);
        if (hit || val.trim()) input.value = '';
      }
    });

    updateLivesDisplay();
    applyWaveSelection();
    showWaveBanner();
    requestAnimationFrame(loop);
  </script>
</body>
</html>
